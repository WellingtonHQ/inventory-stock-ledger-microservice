name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Only one review runs per PR: a newer push cancels the pending (or in-progress)
# run so the latest iteration of the branch is what gets reviewed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        github.event.pull_request.permissions.admin ||
        github.event.pull_request.permissions.maintain ||
        github.event.pull_request.permissions.push ||
        contains('OWNER MEMBER COLLABORATOR', github.event.pull_request.author_association)
      )
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure opencode (single-agent review)
        shell: bash
        # Deny the subagent permission so the review runs as one agent with one
        # LLM request in flight at a time; the local server has a single
        # inference slot, so parallel sub-agents only queue behind it.
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "agents": {
              "build": {
                "permissions": [
                  { "action": "subagent", "resource": "*", "effect": "deny" }
                ]
              }
            }
          }
          EOF

      - name: Run opencode
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USE_GITHUB_TOKEN: "true"
          # opencode asserts the event actor has write permission before running.
          # When the bot's own push triggers this run the actor is
          # github-actions[bot], which can never hold permission, so we assert
          # the PR author instead (write is guaranteed by the job's `if:` guard).
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login }}
          PROMPT: |
            Working rules
            - Do not launch sub-agents (explore, general, or any other). Do all the work yourself in this session, one step at a time

Review this pull request:
            - Check for code quality issues
            - Look for potential bugs or vulnerabilities
            - Focus only on the code changes in this pull request
            - Suggest improvements for readability, performance, and maintainability
        run: opencode github run

      - name: Cleanup Comments
        uses: ./.github/actions/cleanup-comments
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          body-pattern: 'All changes compile|All .* suggestion|Changes Summary|PR Review|Bug fixes implemented|## |No action needed'
